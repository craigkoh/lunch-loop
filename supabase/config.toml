project_id = "lunch-rotation"

[api]
enabled = true
port = 54321

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://127.0.0.1:3000/**",
]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[auth.email.template.magic_link]
subject = "Your Lunch Loop sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your Lunch Loop email"
content_path = "./supabase/templates/confirmation.html"
